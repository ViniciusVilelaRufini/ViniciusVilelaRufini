name: Atualizar cards do perfil

on:
  schedule:
    - cron: "23 9 * * *" # todo dia, 06:23 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "fonts/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install "fonttools>=4.50" pillow

      - name: Atualizar dados de contribuição (data/contributions.json)
        run: python scripts/fetch_contributions.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Renderizar cards (hero, tiles, atividade, repositórios, gráfico)
        run: python scripts/render_cards.py

      - name: Commit dos cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards README.md
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "chore: atualizar cards do perfil"
            git push
          fi
